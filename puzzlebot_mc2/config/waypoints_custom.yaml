# waypoints_custom.yaml
# Parte 2 del MC2: trayectoria con 4 waypoints (3 distintos + regreso al origen).

/**:
  ros__parameters:
    waypoints_x: [0.8, 1.5, 0.5, 0.0]
    waypoints_y: [0.3, 1.0, 1.5, 0.0]

    workspace_min_x: -0.5
    workspace_max_x: 2.5
    workspace_min_y: -0.5
    workspace_max_y: 2.5

    v_max_for_check: 0.15
    goal_timeout_s: 60.0
    publish_delay_s: 3.0
    inter_goal_pause_s: 1.0

