# vision_params.yaml
# Parametros del nodo traffic_light_detector.
# Los rangos HSV son DEFAULTS razonables para iluminacion estandar.
# Calibrar con el script hsv_calibrator.py para tu iluminacion real,
# y copiar los valores finales aqui.

/**:
  ros__parameters:
    image_topic: "/video_source/raw"

    # ============================================================
    # Rangos HSV por color
    # ============================================================
    # OpenCV: H va de 0 a 180 (no 360). S y V van de 0 a 255.
    # El rojo necesita DOS rangos por wrap-around en H (cerca de 0 y de 180).

    red1_h_min: 0
    red1_h_max: 12
    red2_h_min: 165
    red2_h_max: 180
    red_s_min: 80
    red_s_max: 255
    red_v_min: 60
    red_v_max: 255

    yellow_h_min: 15
    yellow_h_max: 42
    yellow_s_min: 70
    yellow_s_max: 255
    yellow_v_min: 70
    yellow_v_max: 255

    green_h_min: 35
    green_h_max: 90
    green_s_min: 70
    green_s_max: 255
    green_v_min: 80
    green_v_max: 255

    debounce_frames: 5

    # ============================================================
    # Filtros geometricos (forma del blob)
    # ============================================================
    # min_area_px: blob mas pequeno que esto se descarta como ruido.
    # Para un circulo de ~3 cm de diametro a 50 cm de la camara
    # con resolucion 640x480, el area en pixeles es ~700-1000.
    min_area_px: 500

    # Circularidad = 4*pi*area / perimeter^2. Un circulo perfecto = 1.0.
    # 0.65 deja pasar circulos con bordes irregulares.
    min_circularity: 0.65

    # Aspect ratio del bounding rect (w/h). 1.0 = cuadrado.
    # Un circulo da un bounding rect cuadrado.
    min_aspect_ratio: 0.7
    max_aspect_ratio: 1.4

    # Tamano del kernel de morphology (open + close para limpiar ruido)
    morph_kernel_size: 5

    # ============================================================
    # Salida
    # ============================================================
    # publish_debug_image: si true, publica /traffic_light_debug
    # con la imagen anotada (contornos + texto). Util para debug.
    publish_debug_image: true

    # publish_rate_hz: tasa fija de publicacion del estado, independiente
    # del frame rate de la camara. Reduce el spam del topico.
    publish_rate_hz: 15.0
