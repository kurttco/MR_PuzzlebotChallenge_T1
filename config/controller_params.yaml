# controller_params.yaml
# Parametros del nodo controller (PID + FSM + slew rate + approach zone).

/**:
  ros__parameters:
    control_mode: "sequential"

    # Ganancias MODO SECUENCIAL (dos PIDs independientes)
    kp_ang: 0.8
    ki_ang: 0.0
    kd_ang: 0.0

    kp_lin: 0.4
    ki_lin: 0.0
    kd_lin: 0.0

    # Ganancias MODO SIMULTANEO
    sim_kp_lin: 0.3
    sim_ki_lin: 0.0
    sim_kp_ang: 0.6
    sim_ki_ang: 0.0

    # Saturacion del actuador
    # omega_max en 0.6: los giros en diferencial son donde mas pico de
    # corriente se genera. Bajar mas si se siguen dando resets.
    v_max: 0.20
    omega_max: 0.45

    # Meta alcanzada (histeresis)
    epsilon_pos: 0.05
    epsilon_ang: 0.05
    hold_time: 0.0

    # Robustez interna del PID
    integral_max: 0.5
    derivative_filter_alpha: 0.2

    # SLEW RATE LIMITING (anti-picos de corriente / resets)
    # v_slew = 0.15 m/s^2  -> de 0 a v_max=0.08 tarda ~0.53 s
    # w_slew = 1.2 rad/s^2 -> de 0 a w_max=0.6 tarda 0.50 s
    # Si la Hackerboard sigue reseteandose, BAJAR estos numeros.
    v_slew_rate: 0.18
    w_slew_rate: 0.8

    # APPROACH ZONE (anti-overshoot)
    # Dentro de 0.30 m del goal, v_max se escala lineal con la distancia.
    # Piso = 25% de v_max.
    approach_zone: 0.25
    approach_zone_min_scale: 0.20

    # Logging
    log_csv: true
    log_dir: "/tmp/puzzlebot_logs"

    # Tasa del loop
    control_rate_hz: 20.0
