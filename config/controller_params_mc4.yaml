# controller_params_mc4.yaml
# Parametros del nodo controller con integracion de semaforo activada.
# Heredados del MC3 + nuevos del MC4.
# Solo ASCII, sin caracteres especiales (limitacion del rcl yaml parser).

/**:
  ros__parameters:
    control_mode: "simultaneous"

    # ---------- Ganancias MODO SECUENCIAL ----------
    kp_ang: 0.6
    ki_ang: 0.0
    kd_ang: 0.0
    kp_lin: 0.4
    ki_lin: 0.0
    kd_lin: 0.0

    # ---------- Ganancias MODO SIMULTANEO ----------
    sim_kp_lin: 0.3
    sim_ki_lin: 0.0
    sim_kp_ang: 0.6


    sim_ki_ang: 0.5

    # ---------- Saturacion del actuador ----------
    v_max: 0.20
    omega_max: 0.3

    # ---------- Meta alcanzada ----------
    epsilon_pos: 0.2
    epsilon_ang: 0.25
    hold_time: 0.2
   
    reorient_threshold: 0.35
    # ---------- Robustez interna del PID ----------
    integral_max: 0.5
    derivative_filter_alpha: 0.2

    # ---------- Slew rate (anti-resets) ----------
    v_slew_rate: 0.18
    w_slew_rate: 0.8

    # ---------- Approach zone (anti-overshoot) ----------
    approach_zone: 0.25
    approach_zone_min_scale: 0.15

    # ---------- Logging ----------
    log_csv: true
    log_dir: "/tmp/puzzlebot_logs"

    # ---------- Tasa del loop ----------
    control_rate_hz: 20.0

    # ============================================================
    # SEMAFORO (NUEVO en MC4)
    # ============================================================
    # enable_semaphore: true para activar la integracion con vision.
    # Con false el controller se comporta identico al MC3.
    enable_semaphore: true
    semaphore_topic: "/semaphore_state"

    # YELLOW: escala del v_max cuando se detecta amarillo.
    # 0.4 = 40% de v_max. omega no se afecta (sigue corrigiendo trayectoria).
    yellow_speed_scale: 0.4

    # GREEN: cuantos frames consecutivos de green se requieren
    # para soltar el latch del rojo. A 15 Hz, 5 frames = ~0.33 s.
    # Asimetria: el RED latcha con UN solo frame (rapidez en parar);
    # el GREEN necesita N frames (lentitud en arrancar = seguridad).
    green_frames_to_release: 3

    # Timeout: si no llega ningun mensaje del topico de semaforo en este
    # tiempo, se considera UNKNOWN (el latch persiste si estaba activo).
    semaphore_timeout_s: 1.0
